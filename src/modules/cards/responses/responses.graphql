"""Trạng thái một câu trả lời: VISIBLE hiện cho mọi người xem thiệp (khi form bật sổ công khai), PENDING chờ chủ thiệp duyệt, HIDDEN đã ẩn."""
enum EntryStatus {
  VISIBLE
  HIDDEN
  PENDING
}

"""Một ô của form, đọc từ bản đã xuất bản của thiệp."""
type FormFieldInfo {
  id: ID!
  label: String!
  """text | longtext | choice | multichoice | number | yesno | date | phone"""
  type: String!
  """Các phương án của ô chọn; rỗng với loại khác."""
  options: [String!]!
}

"""Một form của thiệp, kèm số câu trả lời."""
type CardForm {
  """Mã của khối form trong thiệp."""
  blockId: ID!
  heading: String!
  fields: [FormFieldInfo!]!
  """Bật thì câu trả lời hiện công khai dưới form (sổ lưu bút)."""
  publicList: Boolean!
  moderation: Boolean!
  """Khối không còn trong bản xuất bản nhưng vẫn còn câu trả lời."""
  removed: Boolean!
  total: Int!
  pending: Int!
}

"""Một câu trả lời đã lưu, kèm nhãn câu hỏi lúc trả lời."""
type FormAnswer {
  id: String!
  label: String!
  type: String!
  """string | number | boolean | string[]"""
  value: JSON!
}

"""Một lượt khách gửi form."""
type FormResponse {
  id: ID!
  blockId: String!
  answers: [FormAnswer!]!
  status: EntryStatus!
  createdAt: DateTime!
}

type OptionCount {
  option: String!
  count: Int!
}

"""Tóm tắt một ô, tính trên mọi câu trả lời của khối."""
type FormSummary {
  fieldId: String!
  label: String!
  type: String!
  """Số câu trả lời có trả lời ô này."""
  answered: Int!
  counts: [OptionCount!]!
  """Tổng giá trị của ô số; null với loại khác."""
  total: Float
}

type EntryCounts {
  visible: Int!
  hidden: Int!
  pending: Int!
}

type FormResponseConnection {
  nodes: [FormResponse!]!
  pageInfo: PageInfo!
  summary: [FormSummary!]!
  counts: EntryCounts!
}

extend type Query {
  """Các form của thiệp theo bản xuất bản, cộng các khối đã gỡ còn câu trả lời (chủ thiệp và người sửa thiệp)."""
  cardForms(cardId: ID!): [CardForm!]!

  """Câu trả lời của một thiệp, mới nhất trước, mọi trạng thái (chủ thiệp và người sửa thiệp). `first` từ 1 đến 100. `search` tìm trong các giá trị chữ."""
  formResponses(cardId: ID!, blockId: String, status: EntryStatus, search: String, first: Int = 20, after: String): FormResponseConnection!
}

extend type Mutation {
  """Xoá một câu trả lời (chủ thiệp và người sửa thiệp)."""
  deleteFormResponse(id: ID!): Boolean!

  """Ẩn, hiện hoặc duyệt một câu trả lời (chủ thiệp và người sửa thiệp)."""
  setFormResponseStatus(id: ID!, status: EntryStatus!): FormResponse!
}
