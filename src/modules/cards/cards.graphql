enum CardRole {
  OWNER
  EDITOR
  VIEWER
}

input CreateCardInput {
  title: String!
}

type Card {
  id: ID!
  title: String!
  revision: Int!
  """Vai trò của người đang gọi trên thiệp này."""
  role: CardRole!
  ownerId: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Module đầu tiên khai báo Mutation; các module sau dùng `extend type Mutation`.
type Mutation {
  """Tạo thiệp mới; người gọi là chủ sở hữu."""
  createCard(input: CreateCardInput!): Card!

  """Đổi tiêu đề (owner hoặc editor). Không đụng tới nội dung và revision."""
  updateCardTitle(id: ID!, title: String!): Card!

  """Xóa thiệp cùng bản publish và link mời (chỉ owner)."""
  deleteCard(id: ID!): Boolean!
}
