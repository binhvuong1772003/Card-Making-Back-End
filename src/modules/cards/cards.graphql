enum CardRole {
  OWNER
  EDITOR
  VIEWER
}

"""Dịp của thiệp. OTHER là thiệp không thuộc ba dịp chính, và cũng là giá trị của thiệp cũ chưa có dịp."""
enum CardOccasion {
  WEDDING
  BIRTHDAY
  EVENT
  OTHER
}

input CreateCardInput {
  title: String!
  occasion: CardOccasion
}

type Card {
  id: ID!
  title: String!
  revision: Int!
  """Vai trò của người đang gọi trên thiệp này."""
  role: CardRole!
  ownerId: ID!
  occasion: CardOccasion!
  """Có bản xuất bản đang công khai không."""
  published: Boolean!
  """Số bản xuất bản đang công khai của thiệp."""
  publicationCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PageInfo {
  hasNextPage: Boolean!
  """Con trỏ của phần tử cuối trang; truyền vào `after` để lấy trang kế. Null khi trang rỗng."""
  endCursor: String
}

type CardConnection {
  nodes: [Card!]!
  pageInfo: PageInfo!
}

"""Chi tiết một thiệp: các trường của Card cộng bản nháp."""
type CardDetail {
  id: ID!
  title: String!
  revision: Int!
  role: CardRole!
  ownerId: ID!
  occasion: CardOccasion!
  published: Boolean!
  """Số bản xuất bản đang công khai của thiệp."""
  publicationCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  """Bản nháp. Cấu trúc chưa chốt nên hiện chỉ là JSON nguyên xi."""
  document: JSON!
}

"""Kết quả lưu bản nháp: `revision` mới."""
type SaveDocumentResult {
  revision: Int!
}

extend type Query {
  """Thiệp của người đang gọi (sở hữu và được chia sẻ), mới sửa nhất lên đầu. first từ 1 đến 50, mặc định 20. `occasion` lọc theo dịp (OTHER gồm cả thiệp chưa có dịp); `search` tìm trong tiêu đề, không phân biệt hoa thường."""
  cards(first: Int = 20, after: String, occasion: CardOccasion, search: String): CardConnection!

  """Chi tiết một thiệp; NOT_FOUND nếu không tồn tại hoặc người gọi không liên quan."""
  card(id: ID!): CardDetail
}

# Module đầu tiên khai báo Mutation; các module sau dùng `extend type Mutation`.
type Mutation {
  """Tạo thiệp mới; người gọi là chủ sở hữu."""
  createCard(input: CreateCardInput!): Card!

  """Nhân bản thiệp vào thư viện của người gọi: sao chép bản nháp và dịp, revision 0, tiêu đề thêm "(bản sao)". Ai xem được thiệp đều nhân bản được."""
  duplicateCard(id: ID!): Card!

  """Đổi tiêu đề (owner hoặc editor). Không đụng tới nội dung và revision."""
  updateCardTitle(id: ID!, title: String!): Card!

  """Xóa thiệp cùng bản publish và link mời (chỉ owner)."""
  deleteCard(id: ID!): Boolean!

  """Lưu cả bản nháp (owner hoặc editor), có điều kiện `revision`: CONFLICT nếu `revision` cũ."""
  saveCardDocument(id: ID!, revision: Int!, document: JSON!): SaveDocumentResult!
}
